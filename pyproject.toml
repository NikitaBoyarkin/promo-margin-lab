[project]
name = "promo-margin-lab"
version = "0.1.0"
description = "Promo measurement and trade-spend allocation for offline grocery: counterfactual lift, cannibalization ledger, incremental margin, policy value."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]
spark = ["pyspark>=4.0"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
