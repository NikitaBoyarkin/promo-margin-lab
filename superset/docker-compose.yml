services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superset"]
      interval: 5s
      timeout: 5s
      retries: 20

  superset:
    image: apache/superset:4.1.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-dev-only-change-me}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:superset@postgres/superset
    volumes:
      - ../data/marts:/app/marts:ro
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "8088:8088"
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User
        --email admin@example.com --password admin || true &&
      superset init &&
      gunicorn -w 2 -k gevent --timeout 180 --bind 0.0.0.0:8088 'superset.app:create_app()'
      "

volumes:
  superset_db:
